openapi: 3.0.3
info:
  title: Aeroguard API
  version: "1.0.0"
  description: Training simulator backend - scenario, sessions, scoring, AAR, adaptive recommendation.
servers:
  - url: http://127.0.0.1:8000
paths:
  /api/v1/scenarios/generate:
    post:
      summary: Generate a deterministic training scenario
      operationId: generateScenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioGenerateRequest"
      responses:
        "200":
          description: Generated scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "422":
          description: Invalid scenario configuration
  /api/v1/scenarios/{scenario_id}/view:
    get:
      summary: Redacted trainee view of a scenario
      operationId: getScenarioView
      description: >
        Kinematics plus observable behavior cues only. The frozen Scenario
        contract keeps classification labels and expected responses for
        server-side scoring; this separate route never serves them.
      parameters:
        - name: scenario_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public scenario view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicScenario"
        "404":
          description: Unknown scenario_id
  /api/v1/scenarios/scripted:
    get:
      summary: Catalog of scripted scenarios
      operationId: listScriptedScenarios
      responses:
        "200":
          description: Available instructor-authored fixtures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScriptedScenarioSummary"
    post:
      summary: Release a scripted fixture as a playable scenario
      operationId: createScriptedScenario
      description: >
        The fixture is validated exactly like a generated scenario and
        persisted through the same path, so scoring, AAR, and history are
        identical for scripted and procedural sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptedScenarioRequest"
      responses:
        "200":
          description: Released scenario (deterministic per key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "404":
          description: Unknown scenario_key
        "422":
          description: Invalid fixture
  /api/v1/sessions:
    post:
      summary: Create a training session for a trainee
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreateRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreated"
        "404":
          description: Unknown scenario_id
        "422":
          description: Invalid request body
  /api/v1/sessions/{session_id}/events:
    post:
      summary: Record a timestamped trainee event
      operationId: createEvent
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCreateRequest"
      responses:
        "201":
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventCreated"
        "404":
          description: Session not found
        "422":
          description: Invalid request body
  /api/v1/sessions/{session_id}/complete:
    post:
      summary: End the session and score it server-side
      operationId: completeSession
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session scored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteResponse"
        "404":
          description: Unknown session_id
  /api/v1/sessions/{session_id}/aar:
    get:
      summary: Retrieve the After Action Review for a session
      operationId: getAar
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: AAR document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AAR"
        "404":
          description: Session or AAR not found
  /api/v1/trainees/{trainee_id}/performance:
    get:
      summary: Historical aggregate performance for a trainee
      operationId: getPerformance
      parameters:
        - name: trainee_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Performance profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceProfile"
        "404":
          description: Unknown trainee_id
  /api/v1/trainees/{trainee_id}/sessions:
        get:
          summary: Completed sessions for a trainee, newest first
          operationId: listTraineeSessions
          description: >
            Powers the dashboard's session history. Without this endpoint there is
            no way to list past sessions.
          parameters:
            - name: trainee_id
              in: path
              required: true
              schema:
                type: string
          responses:
            "200":
              description: Session history, most recent first
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionHistoryItem"
            "404":
              description: Unknown trainee_id
  /api/v1/units/{unit}/performance:
        get:
          summary: Aggregate performance across a unit's completed sessions
          operationId: getUnitPerformance
          description: >
            Unit-level rollup for the SIH outcome "AAR dashboard tracking
            individual/unit performance over repeated sessions".
          parameters:
            - name: unit
              in: path
              required: true
              schema:
                type: string
          responses:
            "200":
              description: Unit performance rollup
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/UnitPerformance"
            "404":
              description: Unknown unit
  /api/v1/training/recommend:
    post:
      summary: Recommend the next training configuration from recent performance
      operationId: recommendTraining
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendRequest"
      responses:
        "200":
          description: Recommendation with evidence-based reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendResponse"
        "404":
          description: Unknown trainee_id
        "422":
          description: Invalid request body
  /api/v1/assist/decide:
    post:
      summary: One abstract decision from the optional AI decision assistant
      operationId: assistDecide
      description: >
        The assistant answers a single classification or response decision from
        public observable evidence only. It never receives the hidden label or
        expected response, and its answer is advisory: the client still applies
        it through the normal session gates and records assist provenance.
        Assisted sessions are labelled and excluded from competency rollups.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistRequest"
      responses:
        "200":
          description: One decision from the fixed abstract vocabulary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistDecision"
        "422":
          description: Invalid stage, evidence, or missing classification for respond
components:
    schemas:
      ScenarioGenerateRequest:
        type: object
        required: [difficulty, environment, time_of_day, threat_count]
        properties:
          difficulty:
            type: integer
            minimum: 1
            maximum: 10
          environment:
            type: string
            enum: [urban, rural]
          time_of_day:
            type: string
            enum: [day, night]
          threat_count:
            type: integer
            enum: [1, 2, 3, 5]
          seed:
            type: integer
            description: Optional; server generates one when omitted.
          swarms:
            type: boolean
            default: false
            description: >
              Opt-in grouping. When true, the requested contacts are partitioned
              into swarms that fly as one formation. The contact count, the
              difficulty model, and the scoring denominators are unchanged.
              Off by default so existing seeds keep producing identical
              scenarios.
      Scenario:
        type: object
        required: [scenario_id, seed, generator_version, difficulty, environment, time_of_day, visibility, sensor_quality, duration_seconds, threats]
        properties:
          scenario_id:
            type: string
            example: SCN-100
          seed:
            type: integer
          generator_version:
            type: string
            example: "1.0"
          difficulty:
            type: integer
            minimum: 1
            maximum: 10
          environment:
            type: string
            enum: [urban, rural]
          time_of_day:
            type: string
            enum: [day, night]
          visibility:
            type: string
            enum: [clear, reduced, poor]
          sensor_quality:
            type: number
            minimum: 0
            maximum: 1
          duration_seconds:
            type: number
            minimum: 0
            exclusiveMinimum: true
          threats:
            type: array
            items:
              $ref: "#/components/schemas/ThreatProfile"
      ThreatProfile:
        type: object
        required: [id, classification_label, expected_response, spawn_time]
        properties:
          id:
            type: string
            example: T01
          category:
            type: string
            default: unknown_aerial_object
          classification_label:
            type: string
            enum: [friendly, civilian, unknown, suspicious, hostile]
          expected_response:
            type: string
            enum: [monitor, track, report, hold]
          spawn_time:
            type: number
            minimum: 0
          speed_class:
            type: string
            enum: [slow, medium, fast]
          visibility_class:
            type: string
            enum: [clear, reduced, poor]
          flight_pattern:
            type: string
            enum: [straight-transit, wide-weave, erratic-jink, orbit-hold, direct-approach, altitude-step, perimeter-sweep]
            description: >
              Assigned trajectory, independent of the hidden classification.
              Observable motion, never an answer.
          swarm_id:
            type: string
            nullable: true
            description: >
              Swarm membership id, or null for an independent contact. Contacts
              sharing an id fly as one formation. Observable motion, never an
              answer.
          swarm_index:
            type: integer
            minimum: 0
            nullable: true
            description: Position inside the swarm; 0 is the formation lead.
      PublicThreat:
        type: object
        required: [id, spawn_time, behavior, cue_clear]
        properties:
          id:
            type: string
            example: T01
          spawn_time:
            type: number
            minimum: 0
          speed_class:
            type: string
            enum: [slow, medium, fast]
          visibility_class:
            type: string
            enum: [clear, reduced, poor]
          flight_pattern:
            type: string
            enum: [straight-transit, wide-weave, erratic-jink, orbit-hold, direct-approach, altitude-step, perimeter-sweep]
            description: >
              Assigned trajectory, trainee-visible like behavior.
              Observable motion, never an answer.
          behavior:
            type: string
            description: >
              Observable behavior signature derived from ground truth
              (e.g. steady-transit, orbiting, indeterminate). Never the
              classification label itself.
          cue_clear:
            type: boolean
            description: True when conditions allowed a clean signature read.
          swarm_id:
            type: string
            nullable: true
            description: >
              Swarm membership id, or null for an independent contact. Contacts
              sharing an id fly as one formation. Observable motion, never an
              answer.
          swarm_index:
            type: integer
            minimum: 0
            nullable: true
            description: Position inside the swarm; 0 is the formation lead.
      PublicScenario:
        type: object
        required: [scenario_id, seed, observation_version, difficulty, environment, time_of_day, visibility, sensor_quality, duration_seconds, threats, cue_legend]
        properties:
          scenario_id:
            type: string
            example: SCN-100
          seed:
            type: integer
          observation_version:
            type: string
            example: "1.0"
          difficulty:
            type: integer
            minimum: 1
            maximum: 10
          environment:
            type: string
            enum: [urban, rural]
          time_of_day:
            type: string
            enum: [day, night]
          visibility:
            type: string
            enum: [clear, reduced, poor]
          sensor_quality:
            type: number
            minimum: 0
            maximum: 1
          duration_seconds:
            type: number
            minimum: 0
            exclusiveMinimum: true
          threats:
            type: array
            items:
              $ref: "#/components/schemas/PublicThreat"
          cue_legend:
            type: object
            additionalProperties:
              type: string
            description: >
              Shared recognition doctrine mapping each behavior to what it
              generally suggests. Identical for every scenario, so it teaches
              signatures without revealing any contact's answer.
      ScriptedScenarioRequest:
        type: object
        required: [scenario_key]
        properties:
          scenario_key:
            type: string
            example: first-contact-day
      ScriptedScenarioSummary:
        type: object
        required: [key, title, briefing, difficulty, environment, time_of_day, threat_count]
        properties:
          key:
            type: string
            example: first-contact-day
          title:
            type: string
          briefing:
            type: string
          difficulty:
            type: integer
            minimum: 1
            maximum: 10
          environment:
            type: string
            enum: [urban, rural]
          time_of_day:
            type: string
            enum: [day, night]
          threat_count:
            type: integer
            minimum: 1
      SessionCreateRequest:
        type: object
        required: [trainee_id, scenario_id]
        properties:
            trainee_id:
              type: string
              example: TRAIN-001
            scenario_id:
              type: string
            unit:
              type: string
              nullable: true
              description: >
                Optional cohort grouping used by GET /units/{unit}/performance for
                unit-level rollups across repeated sessions.
              example: ALPHA-1
            ai_assisted:
              type: boolean
              default: false
              description: >
                Opt-in AI-assisted mode: the decision assistant runs the
                detection, classification and response loop. Such sessions are
                labelled in the trainee's history and excluded from competency
                scoring (adaptive level, recommendations, unit rollups).
      SessionCreated:
        type: object
        required: [session_id, status]
        properties:
          session_id:
            type: string
          status:
            type: string
            enum: [active]
      EventCreateRequest:
        type: object
        required: [type, timestamp_ms]
        properties:
          type:
            type: string
            enum:
              - SESSION_STARTED
              - SCENARIO_LOADED
              - THREAT_SPAWNED
              - THREAT_DETECTED
              - CLASSIFICATION_SUBMITTED
              - RESPONSE_SUBMITTED
              - FALSE_ALARM
              - THREAT_MISSED
              - THREAT_RESOLVED
              - SESSION_PAUSED
              - SESSION_RESUMED
              - SESSION_COMPLETED
          timestamp_ms:
            type: integer
            minimum: 0
          threat_id:
            type: string
          payload:
            type: object
            additionalProperties: true
      EventCreated:
        type: object
        required: [event_id, accepted]
        properties:
          event_id:
            type: string
          accepted:
            type: boolean
      AssistRequest:
        type: object
        required: [stage, behavior]
        properties:
          stage:
            type: string
            enum: [classify, respond]
          behavior:
            type: string
            description: >
              Observable behavior signature exactly as the trainee sees it
              (never the hidden label).
            example: orbiting
          cue_clear:
            type: boolean
            default: false
          flight_pattern:
            type: string
            nullable: true
          speed_class:
            type: string
            nullable: true
            description: One of slow, medium, fast.
          observed_via:
            type: string
            enum: [visual, radar, both]
            default: visual
          swarm:
            type: boolean
            default: false
            description: The contact flies as part of a formation group.
          classification:
            type: string
            nullable: true
            enum: [friendly, civilian, unknown, suspicious, hostile]
            description: >
              Required for the respond stage: the assessment already submitted
              for the contact, so the response doctrine follows it.
      AssistDecision:
        type: object
        required: [stage, decision, source]
        properties:
          stage:
            type: string
            enum: [classify, respond]
          decision:
            type: string
            description: >
              For classify, one of friendly, civilian, unknown, suspicious,
              hostile. For respond, one of monitor, track, report, hold.
          source:
            type: string
            enum: [llm, rules]
            description: >
              rules when the deterministic engine answered (offline default or
              LLM fallback); llm only when a configured model answered within
              the fixed vocabulary.
      CompleteResponse:
        type: object
        required: [session_id, detection_score, classification_score, response_score, timing_score, penalty, final_score, aar_available, scoring_version]
        properties:
          session_id:
            type: string
          detection_score:
            type: number
            minimum: 0
            maximum: 100
          classification_score:
            type: number
            minimum: 0
            maximum: 100
          response_score:
            type: number
            minimum: 0
            maximum: 100
          timing_score:
            type: number
            minimum: 0
            maximum: 100
          penalty:
            type: number
            minimum: 0
          final_score:
            type: number
            minimum: 0
            maximum: 100
          aar_available:
            type: boolean
          scoring_version:
            type: integer
      ScoreResult:
        type: object
        required: [session_id, detection_score, classification_score, response_score, timing_score, penalty, final_score, scoring_version]
        properties:
          session_id:
            type: string
          detection_score:
            type: number
          classification_score:
            type: number
          response_score:
            type: number
          timing_score:
            type: number
          penalty:
            type: number
          final_score:
            type: number
            minimum: 0
            maximum: 100
          scoring_version:
            type: integer
      TimingMetrics:
        type: object
        properties:
          mean_time_to_detection_ms:
            type: number
          mean_detection_to_classification_ms:
            type: number
          mean_classification_to_response_ms:
            type: number
          mean_total_decision_ms:
            type: number
      Mistake:
        type: object
        required: [kind, timestamp_ms]
        properties:
          kind:
            type: string
            enum: [missed_threat, false_alarm, classification_error, response_error]
          threat_id:
            type: string
          timestamp_ms:
            type: integer
          detail:
            type: string
      AAR:
        type: object
        required: [session_id, scenario_id, summary, scores, timing, mistakes, strengths, weaknesses, recommendation, timeline, ground_truth]
        properties:
          session_id:
            type: string
          scenario_id:
            type: string
          summary:
            type: string
          scores:
            $ref: "#/components/schemas/ScoreResult"
          timing:
            $ref: "#/components/schemas/TimingMetrics"
          mistakes:
            type: array
            items:
              $ref: "#/components/schemas/Mistake"
          strengths:
            type: array
            items:
              type: string
          weaknesses:
            type: array
            items:
              type: string
          recommendation:
            type: string
          timeline:
            type: array
            items:
              $ref: "#/components/schemas/EventCreateRequest"
          ground_truth:
            type: array
            description: >
              Per-contact answers, served only inside the post-completion AAR
              so trainees can study what each signature meant.
            items:
              $ref: "#/components/schemas/GroundTruthItem"
      GroundTruthItem:
        type: object
        required: [threat_id, classification_label, expected_response]
        properties:
          threat_id:
            type: string
          classification_label:
            type: string
            enum: [friendly, civilian, unknown, suspicious, hostile]
          expected_response:
            type: string
            enum: [monitor, track, report, hold]
      SessionHistoryItem:
        type: object
        required: [session_id, scenario_id, final_score, environment, time_of_day, difficulty, threat_count]
        properties:
          session_id:
            type: string
          scenario_id:
            type: string
          unit:
            type: string
            nullable: true
          ai_assisted:
            type: boolean
            description: >
              True when the session ran in AI-assisted mode. Display-only:
              excluded from adaptive and unit rollups, still listed here.
          completed_at:
            type: string
            nullable: true
          final_score:
            type: number
          environment:
            type: string
          time_of_day:
            type: string
          difficulty:
            type: integer
          threat_count:
            type: integer
      UnitWeakness:
        type: object
        required: [condition, score, gap]
        properties:
          condition:
            type: string
          score:
            type: number
          gap:
            type: number
            description: Points this condition trails the unit mean.
      UnitPerformance:
        type: object
        required: [unit, session_count, trainee_count, detection_accuracy, classification_accuracy, response_accuracy]
        properties:
          unit:
            type: string
          session_count:
            type: integer
          trainee_count:
            type: integer
          mean_final_score:
            type: number
            nullable: true
          best_final_score:
            type: number
            nullable: true
          detection_accuracy:
            type: number
          classification_accuracy:
            type: number
          response_accuracy:
            type: number
          average_reaction_time_ms:
            type: number
            nullable: true
          mean_timing_score:
            type: number
            nullable: true
          weaknesses:
            type: array
            items:
              $ref: "#/components/schemas/UnitWeakness"
      PerformanceProfile:
        type: object
        required: [trainee_id, session_count, detection_accuracy, classification_accuracy, response_accuracy]
        properties:
          trainee_id:
            type: string
          session_count:
            type: integer
          detection_accuracy:
            type: number
            minimum: 0
            maximum: 100
          classification_accuracy:
            type: number
            minimum: 0
            maximum: 100
          response_accuracy:
            type: number
            minimum: 0
            maximum: 100
          average_reaction_time_ms:
            type: number
          night_score:
            type: number
          day_score:
            type: number
          multi_threat_score:
            type: number
          low_visibility_score:
            type: number
          urban_score:
            type: number
          rural_score:
            type: number
          clear_visibility_score:
            type: number
          reduced_visibility_score:
            type: number
          poor_visibility_score:
            type: number
          high_sensor_score:
            type: number
          medium_sensor_score:
            type: number
          low_sensor_score:
            type: number
          current_level:
            type: integer
            minimum: 1
            maximum: 10
      RecommendRequest:
        type: object
        required: [trainee_id]
        properties:
          trainee_id:
            type: string
      RecommendResponse:
        type: object
        required: [recommended_difficulty, environment, time_of_day, threat_count, reason]
        properties:
          recommended_difficulty:
            type: integer
            minimum: 1
            maximum: 10
          environment:
            type: string
            enum: [urban, rural]
          time_of_day:
            type: string
            enum: [day, night]
          threat_count:
            type: integer
            enum: [1, 2, 3, 5]
          reason:
            type: string
            description: Human-readable evidence drawn from measured session metrics.
